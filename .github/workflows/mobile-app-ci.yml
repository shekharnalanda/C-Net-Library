name: C-Net Library Mobile App CI

on:
  push:
    branches:
      - mobile-app
    paths:
      - 'mobile_app/**'
      - 'public/images/cnet-library-logo.png'
      - 'public/images/cnet-library-icon.png'
      - '.github/workflows/mobile-app-ci.yml'
  pull_request:
    paths:
      - 'mobile_app/**'
      - 'public/images/cnet-library-logo.png'
      - 'public/images/cnet-library-icon.png'
      - '.github/workflows/mobile-app-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flutter-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CNET_KEY_ALIAS: cnetlibrary
      CNET_EXPECTED_CERT_SHA256: 3bf2330d80190be520721db4a7624089e7020522fcc052a6491eab4705acbdfe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install official C-Net Library branding assets
        run: |
          test -f public/images/cnet-library-logo.png
          test -f public/images/cnet-library-icon.png
          mkdir -p mobile_app/assets
          cp public/images/cnet-library-logo.png mobile_app/assets/cnet-library-logo.png
          cp public/images/cnet-library-icon.png mobile_app/assets/cnet-library-icon.png
          test -s mobile_app/assets/cnet-library-logo.png

      - name: Generate Android platform scaffold
        working-directory: mobile_app
        run: flutter create --platforms=android --org com.mciedu.cnetlibrary --project-name cnetlibrary .

      - name: Ensure Android internet permission
        working-directory: mobile_app
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi
          grep -q 'android.permission.INTERNET' "$MANIFEST"

      - name: Verify production API DNS and HTTPS
        run: |
          getent hosts cnetlibrary.mciedu.com
          curl --fail --silent --show-error --location --max-time 20 https://cnetlibrary.mciedu.com/ >/dev/null

      - name: Validate permanent release signing secrets
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.CNET_LIBRARY_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.CNET_LIBRARY_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.CNET_LIBRARY_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing CNET_LIBRARY_KEYSTORE_B64 secret"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing CNET_LIBRARY_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing CNET_LIBRARY_KEY_PASSWORD secret"; exit 1; }

      - name: Install permanent C-Net Library signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.CNET_LIBRARY_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.CNET_LIBRARY_KEYSTORE_PASSWORD }}
        working-directory: mobile_app
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/cnetlibrary-upload-key.jks
          test -s android/app/cnetlibrary-upload-key.jks
          CERT_SHA=$(keytool -list -v \
            -keystore android/app/cnetlibrary-upload-key.jks \
            -alias "$CNET_KEY_ALIAS" \
            -storepass "$STORE_PASSWORD" \
            | awk '/SHA256:/{print $2; exit}' \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')
          test "$CERT_SHA" = "$CNET_EXPECTED_CERT_SHA256" || {
            echo "Signing certificate fingerprint mismatch. Refusing release.";
            exit 1;
          }
          echo "PERMANENT_SIGNING_CERTIFICATE=VERIFIED"

      - name: Configure release signing
        if: github.event_name != 'pull_request'
        env:
          CNET_STORE_PASSWORD: ${{ secrets.CNET_LIBRARY_KEYSTORE_PASSWORD }}
          CNET_KEY_PASSWORD: ${{ secrets.CNET_LIBRARY_KEY_PASSWORD }}
        working-directory: mobile_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          signing = '''
              signingConfigs {
                  create("cnetRelease") {
                      keyAlias = System.getenv("CNET_KEY_ALIAS")
                      keyPassword = System.getenv("CNET_KEY_PASSWORD")
                      storeFile = file("cnetlibrary-upload-key.jks")
                      storePassword = System.getenv("CNET_STORE_PASSWORD")
                  }
              }
          '''
          if 'create("cnetRelease")' not in s:
              s = s.replace('android {', 'android {\n' + signing, 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("cnetRelease")')
          p.write_text(s)
          PY
          grep -q 'signingConfigs.getByName("cnetRelease")' android/app/build.gradle.kts

      - name: Install dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Analyze
        working-directory: mobile_app
        run: flutter analyze

      - name: Test
        working-directory: mobile_app
        run: flutter test

      - name: Build Android APK
        working-directory: mobile_app
        run: flutter build apk --release
        env:
          CNET_STORE_PASSWORD: ${{ secrets.CNET_LIBRARY_KEYSTORE_PASSWORD }}
          CNET_KEY_PASSWORD: ${{ secrets.CNET_LIBRARY_KEY_PASSWORD }}

      - name: Verify release APK certificate
        if: github.event_name != 'pull_request'
        working-directory: mobile_app
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          APK_CERT_SHA=$("$APKSIGNER" verify --print-certs "$APK" \
            | awk -F': ' '/certificate SHA-256 digest/{print $2; exit}' \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')
          test "$APK_CERT_SHA" = "$CNET_EXPECTED_CERT_SHA256" || {
            echo "Built APK certificate mismatch. Refusing publication.";
            exit 1;
          }
          echo "SIGNED_APK_CERTIFICATE=VERIFIED"

      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cnet-library-android-release
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish only verified signed APK to website main branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/mobile-app'
        run: |
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk /tmp/C-Net-Library.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p public/downloads
          cp /tmp/C-Net-Library.apk public/downloads/C-Net-Library.apk
          git add public/downloads/C-Net-Library.apk
          if git diff --cached --quiet; then
            echo "Website APK is already current."
          else
            git commit -m "Publish verified signed C-Net Library Android APK"
            git push origin main
          fi
