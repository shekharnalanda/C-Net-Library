name: C-Net Library Mobile App CI

on:
  push:
    branches:
      - mobile-app
    paths:
      - 'mobile_app/**'
      - '.github/workflows/mobile-app-ci.yml'
  pull_request:
    paths:
      - 'mobile_app/**'
      - '.github/workflows/mobile-app-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android platform scaffold
        working-directory: mobile_app
        run: flutter create --platforms=android --org com.mciedu.cnetlibrary --project-name cnetlibrary .

      - name: Ensure Android internet permission
        working-directory: mobile_app
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi
          grep -q 'android.permission.INTERNET' "$MANIFEST"
          cat "$MANIFEST"

      - name: Verify production API DNS and HTTPS
        run: |
          getent hosts cnetlibrary.mciedu.com
          curl --fail --silent --show-error --location --max-time 20 https://cnetlibrary.mciedu.com/ >/dev/null

      - name: Install dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Analyze
        working-directory: mobile_app
        run: flutter analyze

      - name: Test
        working-directory: mobile_app
        run: flutter test

      - name: Build Android APK
        working-directory: mobile_app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cnet-library-android-release
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
