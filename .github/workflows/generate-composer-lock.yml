name: Generate Composer Lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none

      - name: Prepare Laravel runtime directories
        run: |
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs

      - name: Validate Composer manifest
        run: composer validate --no-check-publish --no-check-lock

      - name: Generate lockfile
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Verify lockfile
        run: |
          test -f composer.lock
          composer validate --no-check-publish

      - name: Commit lockfile to main
        run: |
          if git diff --quiet -- composer.lock; then
            echo "composer.lock is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "Update Composer lockfile"
          git push origin HEAD:main

      - name: Upload lockfile artifact
        uses: actions/upload-artifact@v4
        with:
          name: composer-lock
          path: composer.lock
          if-no-files-found: error
          retention-days: 7
