name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  laravel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, curl, dom, fileinfo, iconv, openssl, pdo_sqlite, sqlite3, tokenizer
          coverage: none

      - name: Require Composer lockfile
        run: test -f composer.lock || (echo "::error::composer.lock is required for reproducible CI and production deployments." && exit 1)

      - name: Validate Composer manifest and lockfile
        run: composer validate --no-check-publish

      - name: Prepare Laravel runtime directories
        run: |
          mkdir -p bootstrap/cache
          mkdir -p public
          mkdir -p storage/app/public
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          rm -f database/database.sqlite
          touch database/database.sqlite
          php artisan key:generate
          php artisan storage:link

      - name: Run migrations
        env:
          APP_ENV: testing
          APP_DEBUG: true
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force

      - name: Verify routes and scheduler
        env:
          APP_ENV: testing
          APP_DEBUG: true
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: |
          php artisan route:list
          php artisan schedule:list

      - name: Run release smoke checks
        env:
          APP_ENV: testing
          APP_DEBUG: true
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan release:smoke

      - name: Run tests
        env:
          APP_ENV: testing
          APP_DEBUG: true
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          ADMIN_NAME: CI Administrator
          ADMIN_EMAIL: ci-admin@example.test
          ADMIN_PASSWORD: CI-only-password-123!
        run: php artisan test
