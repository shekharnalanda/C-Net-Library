name: C-Net Library Mobile App CI

on:
  push:
    branches:
      - mobile-app
    paths:
      - 'mobile_app/**'
      - 'public/images/cnet-library-logo.png'
      - 'public/images/cnet-library-icon.png'
      - '.github/workflows/mobile-app-ci.yml'
  pull_request:
    paths:
      - 'mobile_app/**'
      - 'public/images/cnet-library-logo.png'
      - 'public/images/cnet-library-icon.png'
      - '.github/workflows/mobile-app-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flutter-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install official C-Net Library branding assets
        run: |
          test -f public/images/cnet-library-logo.png
          test -f public/images/cnet-library-icon.png
          mkdir -p mobile_app/assets
          cp public/images/cnet-library-logo.png mobile_app/assets/cnet-library-logo.png
          cp public/images/cnet-library-icon.png mobile_app/assets/cnet-library-icon.png
          test -s mobile_app/assets/cnet-library-logo.png

      - name: Generate Android platform scaffold
        working-directory: mobile_app
        run: flutter create --platforms=android --org com.mciedu.cnetlibrary --project-name cnetlibrary .

      - name: Ensure Android internet permission
        working-directory: mobile_app
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi
          grep -q 'android.permission.INTERNET' "$MANIFEST"

      - name: Verify production API DNS and HTTPS
        run: |
          getent hosts cnetlibrary.mciedu.com
          curl --fail --silent --show-error --location --max-time 20 https://cnetlibrary.mciedu.com/ >/dev/null

      - name: Install dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Analyze
        working-directory: mobile_app
        run: flutter analyze

      - name: Test
        working-directory: mobile_app
        run: flutter test

      - name: Build Android APK
        working-directory: mobile_app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cnet-library-android-release
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest APK to website main branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/mobile-app'
        run: |
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk /tmp/C-Net-Library.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p public/downloads
          cp /tmp/C-Net-Library.apk public/downloads/C-Net-Library.apk
          git add public/downloads/C-Net-Library.apk
          if git diff --cached --quiet; then
            echo "Website APK is already current."
          else
            git commit -m "Publish latest C-Net Library Android APK"
            git push origin main
          fi
